<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}daily-agents{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/htmx.min.js" defer></script>
</head>
<body data-planet="{{ planet | default('earth') }}">
  <header class="topbar">
    <a class="brand" href="/">daily · agents</a>
    <nav>
      <a href="/" class="{% if active == 'dashboard' %}on{% endif %}">dashboard</a>
      <a href="/applications" class="{% if active == 'applications' %}on{% endif %}">applications</a>
      <a href="/resume" class="{% if active == 'resume' %}on{% endif %}">résumé</a>
      <a href="/history" class="{% if active == 'history' %}on{% endif %}">history</a>
      <a href="/settings" class="{% if active == 'settings' %}on{% endif %}">settings</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
